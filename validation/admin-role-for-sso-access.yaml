AWSTemplateFormatVersion: "2010-09-09"

Parameters:
  TrustedAccountId:
    Description: AWS Account ID allowed to assume this role
    Type: String
    AllowedPattern: '^\d{12}$'
    ConstraintDescription: must be a 12-digit AWS Account ID

Resources:
  AdminSSORole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: AdminAccessForSSO
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${TrustedAccountId}:root"
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess

Outputs:
  RoleArn:
    Description: ARN of the IAM Role
    Value: !GetAtt AdminSSORole.Arn